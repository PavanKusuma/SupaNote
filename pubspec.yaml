name: supa_note
description: "A minimal, classy audio notes app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  record: ^5.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  intl: ^0.19.0
  uuid: ^4.5.1
  path: ^1.9.0

dependency_overrides:
  record_linux: ^1.3.0
  record_windows: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
